  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #e5e7eb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .scroll-hidden::-webkit-scrollbar { display: none; }
    .scroll-hidden { -ms-overflow-style: none; scrollbar-width: none; }

    /* Card gradient & UI elements */
    .card-gradient { background: linear-gradient(135deg, #065f46 0%, #0d7757 40%, #0f766e 100%); }
    .card-mesh::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(circle at 20% 80%, rgba(255,255,255,0.07) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.05) 0%, transparent 50%);
      border-radius: inherit; pointer-events: none;
    }
    .card-circle { position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); }
    
    /* Interactions */
    .nav-btn { transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .nav-btn:active { transform: scale(0.88); }
    .action-btn { transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .action-btn:hover { transform: translateY(-1px); }
    .action-btn:active { transform: scale(0.95) translateY(0); }

    /* Toast System */
    #toast-container {
      position: absolute; top: 0; left: 0; right: 0; z-index: 9999;
      pointer-events: none; display: flex; flex-direction: column; align-items: center;
      padding-top: 12px; gap: 8px;
    }
    .toast { pointer-events: auto; animation: slideInTop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .toast.removing { animation: slideOutTop 0.35s ease-in forwards; }

    /* Animations */
    .bar-animated { width: 0%; animation: barFill 1.1s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.4s forwards; }
    .fade-up-1 { opacity: 0; animation: fadeUp 0.5s ease 0.1s forwards; }
    .fade-up-2 { opacity: 0; animation: fadeUp 0.5s ease 0.2s forwards; }
    .fade-up-3 { opacity: 0; animation: fadeUp 0.5s ease 0.3s forwards; }

    @keyframes fadeUp { 0% { transform: translateY(16px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes barFill { 0% { width: 0%; } 100% { width: var(--bar-width); } }
    @keyframes slideInTop { 0% { transform: translateY(-120%) scale(0.92); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes slideOutTop { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-120%) scale(0.92); opacity: 0; } }
    @keyframes pulseDot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: 0.5; } }
    
    /* Red Pulse Dot Logic */
    .notif-dot-active::after {
      content: ''; position: absolute; inset: -2px; border-radius: 50%;
      border: 2px solid #ef4444; animation: pulseDot 2s ease-in-out infinite;
    }

    /* Panel Transition */
    .panel-slide { transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
  </style>
</head>

  </div> <script>
    // ── CONFIG & GLOBAL STATE ──
    const toastContainer = document.getElementById('toast-container');
    const notifListContainer = document.getElementById('notif-list-container');
    const notifRedDot = document.getElementById('notif-red-dot');
    const notifBellBtn = document.getElementById('notif-bell-btn');
    const dndToggleBtn = document.getElementById('dnd-toggle-btn');
    const dndStatusText = document.getElementById('dnd-status-text');

    let isDNDActive = false; // Status Do Not Disturb
    let notificationsData = []; // Penyimpanan notifikasi dinamis (Mulai dari KOSONG)

    const toastConfig = {
      success: { icon: 'fa-circle-check', bg: 'from-emerald-600 to-teal-600', ring: 'ring-emerald-400/30' },
      info: { icon: 'fa-circle-info', bg: 'from-brand-800 to-brand-700', ring: 'ring-brand-400/30' },
      warning: { icon: 'fa-triangle-exclamation', bg: 'from-amber-500 to-orange-500', ring: 'ring-amber-400/30' },
      error: { icon: 'fa-circle-xmark', bg: 'from-rose-600 to-red-600', ring: 'ring-rose-400/30' },
    };

    // ── TOAST SYSTEM WITH DND CHECK ──
    function showToast(type, title, message) {
      // Jika DND aktif, tidak akan menampilkan banner push notification (toast) ke layar luar
      if (isDNDActive) {
        console.log("Push Notification dibungkam karena DND Aktif.");
        return;
      }

      const cfg = toastConfig[type] || toastConfig.info;
      const el = document.createElement('div');
      el.className = `toast flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl ring-1 ${cfg.ring} text-white max-w-xs w-[85%]`;
      el.style.background = `linear-gradient(135deg, var(--tw-gradient-stops))`;
      el.classList.add('bg-gradient-to-br', ...cfg.bg.split(' '));
      el.innerHTML = `
        <div class="w-8 h-8 rounded-xl bg-white/20 flex items-center justify-center flex-shrink-0"><i class="fa-solid ${cfg.icon} text-white text-sm"></i></div>
        <div class="flex-1 min-w-0"><p class="text-xs font-semibold leading-tight">${title}</p><p class="text-xs text-white/80 leading-tight mt-0.5 truncate">${message}</p></div>
        <button onclick="dismissToast(this.closest('.toast'))" class="w-5 h-5 flex items-center justify-center opacity-60 hover:opacity-100 flex-shrink-0"><i class="fa-solid fa-xmark text-xs"></i></button>
      `;
      toastContainer.appendChild(el);
      const timer = setTimeout(() => dismissToast(el), 3500);
      el._timer = timer;
    }

    function dismissToast(el) {
      if (!el || el.classList.contains('removing')) return;
      clearTimeout(el._timer);
      el.classList.add('removing');
      el.addEventListener('animationend', () => el.remove(), { once: true });
    }

    // ── TOGGLE DO NOT DISTURB (DND) ──
    function toggleDND() {
      isDNDActive = !isDNDActive;
      if (isDNDActive) {
        dndToggleBtn.classList.remove('bg-gray-100', 'text-gray-500', 'hover:bg-gray-200');
        dndToggleBtn.classList.add('bg-red-500', 'text-white', 'hover:bg-red-600');
        dndStatusText.textContent = "Muted";
        showToast('info', 'DND Aktif', 'Semua banner notifikasi luar telah dibungkam.');
      } else {
        dndToggleBtn.classList.remove('bg-red-500', 'text-white', 'hover:bg-red-600');
        dndToggleBtn.classList.add('bg-gray-100', 'text-gray-500', 'hover:bg-gray-200');
        dndStatusText.textContent = "Mute";
        showToast('success', 'DND Nonaktif', 'Banner notifikasi kembali normal.');
      }
    }

    // ── ENGINE PENGATURAN DATA NOTIFIKASI (DINAMIS) ──
    function insertNewNotification(type, title, desc) {
      // Masukkan objek notifikasi baru ke tumpukan paling atas
      notificationsData.unshift({
        id: Date.now(),
        type: type, // 'warning', 'info', 'success'
        title: title,
        desc: desc,
        time: 'Baru saja',
        unread: true
      });

      // Hidupkan Red Pulse Dot di tombol luar
      notifRedDot.classList.remove('hidden');
      notifBellBtn.classList.add('notif-dot-active');

      // Tembakkan banner toast
      showToast(type, title, desc);

      // Render ulang isi panelnya
      renderNotificationsPanel();
    }

    function renderNotificationsPanel() {
      // Jika data kosong, tampilkan ilustrasi Empty State yang rapi
      if (notificationsData.length === 0) {
        notifListContainer.innerHTML = `
          <div class="flex flex-col items-center justify-center py-20 text-center px-4">
            <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mb-4 text-gray-300">
              <i class="fa-regular fa-bell-slash text-2xl"></i>
            </div>
            <p class="text-sm font-bold text-gray-700">Belum Ada Notifikasi</p>
            <p class="text-xs text-gray-400 mt-1 max-w-[200px]">Notifikasi transaksi dan pengingat Anda akan muncul di sini setelah digunakan.</p>
          </div>
        `;
        return;
      }

      // Jika ada falls, render satu per satu komponennya
      let htmlString = '';
      notificationsData.forEach(notif => {
        let leftBarColor = 'bg-brand-500';
        let circleBg = 'bg-emerald-50';
        let iconClass = 'fa-check text-emerald-500';

        if (notif.type === 'warning') {
          leftBarColor = 'bg-rose-500';
          circleBg = 'bg-rose-50';
          iconClass = 'fa-triangle-exclamation text-rose-500';
        } else if (notif.type === 'info') {
          leftBarColor = 'bg-blue-500';
          circleBg = 'bg-blue-50';
          iconClass = 'fa-file-invoice-dollar text-blue-500';
        }

        htmlString += `
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden transition-all duration-300">
            <div class="absolute top-0 left-0 w-1 h-full ${leftBarColor}"></div>
            <div class="flex gap-3">
              <div class="w-10 h-10 rounded-full ${circleBg} flex items-center justify-center flex-shrink-0">
                <i class="fa-solid ${iconClass} text-sm"></i>
              </div>
              <div class="flex-1">
                <div class="flex justify-between items-start">
                  <p class="text-sm font-bold text-gray-800 leading-tight mb-1">${notif.title}</p>
                  ${notif.unread ? '<span class="w-1.5 h-1.5 bg-red-500 rounded-full"></span>' : ''}
                </div>
                <p class="text-xs text-gray-500 leading-relaxed">${notif.desc}</p>
                <p class="text-[10px] text-gray-400 mt-2 font-medium">${notif.time}</p>
              </div>
            </div>
          </div>
        `;
      });
      notifListContainer.innerHTML = htmlString;
    }

    // Awal load aplikasi: Panggil render agar kondisi awal kosong/empty-state langsung terbentuk
    renderNotificationsPanel();

    // ── PANEL NAVIGATION LOGIC ──
    const profilePanel = document.getElementById('profile-panel');
    const notifPanel = document.getElementById('notif-panel');
    function openProfilePanel() { profilePanel.classList.remove('translate-x-full'); }
    function closeProfilePanel() { profilePanel.classList.add('translate-x-full'); }
    
    function openNotifPanel() { 
      notifPanel.classList.remove('translate-x-full'); 
      
      // LOGIKA TERBACA: Saat panel notifikasi dibuka, matikan semua red pulse dot di luar
      notifRedDot.classList.add('hidden');
      notifBellBtn.classList.remove('notif-dot-active');

      // Set semua notifikasi di dalam data menjadi sudah dibaca (unread = false)
      notificationsData.forEach(notif => notif.unread = false);
      renderNotificationsPanel();
    }
    function closeNotifPanel() { notifPanel.classList.add('translate-x-full'); }

    // ── BALANCE LOGIC & TRIGGER EVENT SALDO RENDAH ──
    let currentBalance = parseInt(localStorage.getItem('smartwallet_balance')) || 5000000;
    const balanceEl = document.getElementById('balance-amount');
    const btnTopUp = document.getElementById('btn-topup');
    const btnTransfer = document.getElementById('btn-transfer');
    
    let balanceVisible = false; 
    let lowBalanceNotified = false;

    function formatRupiah(number) { return new Intl.NumberFormat('id-ID').format(number); }

    function updateBalanceUI() {
      if (balanceVisible) {
        balanceEl.textContent = 'Rp ' + formatRupiah(currentBalance);
        balanceEl.style.letterSpacing = '-0.02em';
      } else {
        balanceEl.textContent = 'Rp •••.•••.•••';
        balanceEl.style.letterSpacing = '0.1em';
      }
      
      // LOGIKA EVENT-DRIVEN: Otomatis memicu notifikasi jika saldo jatuh di bawah Rp 500.000
      if (currentBalance < 500000 && !lowBalanceNotified) {
        setTimeout(() => {
          insertNewNotification('warning', 'Peringatan Saldo Rendah', `Saldo Anda tersisa Rp ${formatRupiah(currentBalance)}. Segera top-up dompet Anda!`);
        }, 800);
        lowBalanceNotified = true;
      } else if (currentBalance >= 500000) {
        lowBalanceNotified = false; // Reset status jika user top-up lagi
      }
    }

    updateBalanceUI();
    balanceEl.addEventListener('click', () => { balanceVisible = !balanceVisible; updateBalanceUI(); });

    // ── CUSTOM MODAL LOGIC ──
    const customModal = document.getElementById('custom-modal');
    const modalCard = document.getElementById('modal-card');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalInput = document.getElementById('modal-input');
    let currentAction = '';

    function openModal(action, title, desc) {
      currentAction = action; modalTitle.textContent = title; modalDesc.textContent = desc; modalInput.value = '';
      customModal.classList.remove('opacity-0', 'pointer-events-none');
      modalCard.classList.remove('scale-95'); modalCard.classList.add('scale-100');
      setTimeout(() => modalInput.focus(), 100);
    }
    function closeModal() {
      customModal.classList.add('opacity-0', 'pointer-events-none');
      modalCard.classList.remove('scale-100'); modalCard.classList.add('scale-95'); modalInput.blur();
    }

    btnTopUp.addEventListener('click', () => openModal('topup', 'Top-Up Saldo', 'Masukkan nominal uang yang ingin ditambahkan.'));
    btnTransfer.addEventListener('click', () => openModal('transfer', 'Transfer Uang', 'Masukkan nominal yang ingin dikirim.'));
    document.getElementById('btn-cancel').addEventListener('click', closeModal);
    customModal.addEventListener('click', (e) => { if (e.target === customModal) closeModal(); });
    modalInput.addEventListener('input', function() { this.value = this.value.replace(/[^0-9]/g, ''); });

    document.getElementById('btn-confirm').addEventListener('click', () => {
      const amount = parseInt(modalInput.value);
      if (!amount || amount <= 0 || isNaN(amount)) { showToast('error', 'Gagal', 'Masukkan nominal yang valid.'); return; }

      if (currentAction === 'topup') {
        currentBalance += amount; localStorage.setItem('smartwallet_balance', currentBalance);
        updateBalanceUI();
        
        // Memasukkan log notifikasi sukses Top Up secara dinamis
        insertNewNotification('success', 'Top-Up Berhasil', `Berhasil menambahkan Rp ${formatRupiah(amount)} ke saldo Anda.`);
        closeModal();
      } 
      else if (currentAction === 'transfer') {
        if (amount <= currentBalance) {
          currentBalance -= amount; localStorage.setItem('smartwallet_balance', currentBalance);
          updateBalanceUI();
          
          // Memasukkan log notifikasi sukses Transfer secara dinamis
          insertNewNotification('success', 'Transfer Berhasil', `Berhasil mengirim uang sebesar Rp ${formatRupiah(amount)}.`);
          closeModal();
        } else { 
          showToast('warning', 'Transfer Gagal', 'Saldo Anda tidak mencukupi.'); 
        }
      }
    });

    // ── SIMULATOR EVENT EKSTERNAL (UNTUK DEMO KELAS) ──
    // Fungsi ini dipicu saat menekan tombol "Simulasi Bill" di menu utama
    function triggerSplitBillReminder() {
      insertNewNotification('info', 'Reminder Hutang: Split Bill', 'Tagihan Makan Siang Bersama sebesar Rp 45.000 belum diselesaikan.');
    }
  </script>
</body>
</html>
